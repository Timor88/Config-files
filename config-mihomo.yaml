# Clash Verge / Mihomo 全局扩展覆写配置
# 与订阅合并使用，节点由订阅提供；策略组和 rules 列表整体替换。
# 地区依据节点名称筛选，不代表服务器真实位置。
profile:
  store-selected: true
proxy-groups:
  - name: 选择代理
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
    type: select
    include-all: true
    proxies:
      - 新加坡自动
      - 美国自动
      - 香港自动

  # 地区组：每 5 分钟测速，延迟差超过 50ms 才考虑切换。
  # 没有匹配节点时拒绝连接，避免意外直连。
  - name: 新加坡自动
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Singapore.png
    type: url-test
    include-all: true
    filter: '(?i)(新加坡|狮城|獅城|singapore|🇸🇬|(^|[^a-z])sg([^a-z]|$))'
    empty-fallback: REJECT
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  - name: 美国自动
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png
    type: url-test
    include-all: true
    filter: '(?i)(美国|美國|united[ _-]?states|america|🇺🇸|🇺🇲|(^|[^a-z])us([^a-z]|$)|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|硅谷|矽谷)'
    empty-fallback: REJECT
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  - name: 香港自动
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png
    type: url-test
    include-all: true
    filter: '(?i)(香港|hong[ _-]?kong|🇭🇰|(^|[^a-z])hk([^a-z]|$))'
    empty-fallback: REJECT
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  # AI 手动组：仅显示美国、新加坡节点及对应自动组。
  - name: AI服务
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ChatGPT.png
    type: select
    include-all: true
    filter: '(?i)(新加坡|狮城|獅城|singapore|🇸🇬|(^|[^a-z])sg([^a-z]|$)|美国|美國|united[ _-]?states|america|🇺🇸|🇺🇲|(^|[^a-z])us([^a-z]|$)|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|硅谷|矽谷)'
    empty-fallback: REJECT
    proxies:
      - 美国自动
      - 新加坡自动

rule-providers:
  AIProxy:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/VPSDance/ai-proxy-rules@main/rules/clash/global.yaml
    path: ./ruleset/AIProxy-global.yaml
    interval: 86400

  reject:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400

  adobe:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Timor88/Config-files/refs/heads/main/adobe.txt"
    path: ./ruleset/adobe.yaml
